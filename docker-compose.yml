services:
  app:
    build: .
    container_name: speakup-api
    env_file: .env
    # Telegram pin: this RU-hosted box has flaky/partial routing to
    # Telegram. DNS often returns an unreachable IPv6, or the resolver
    # picks the blocked 149.154.166.0/24 range, which made tele.NewBot()'s
    # getMe call time out at boot and left the bot dead (webhook returns
    # 200 but no replies are ever sent). Pin api.telegram.org to a
    # consistently-reachable IPv4 so boot-time init is deterministic.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    ports:
      - "127.0.0.1:8082:8082"
    # Partner-centre logos. MUST be a named volume: these files are
    # uploaded by partners and are not in the image, so without this a
    # rebuild would silently blank every banner on the platform.
    volumes:
      - speakup_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # started, NOT service_healthy: the sidecar spends a couple of minutes
      # fetching 1.5 GB of models the first time it ever runs, and the rest of
      # the app must not wait for that. Pronunciation endpoints report
      # "unavailable" until /health goes green.
      talaffuz:
        condition: service_started
    restart: unless-stopped
    # CRITICAL for scale: each WebSocket connection = 1 file
    # descriptor. Default docker ulimit is 1024, so without this
    # the Go process would refuse new connections around 900-1000
    # concurrent users - exactly the scale you care about.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Cap RAM so a runaway can never kill the host. speakup-api
    # normally uses <30 MB even under load; 512 MB is a 15x
    # headroom that still leaves room for other apps on this box.
    mem_limit: 512m
    mem_reservation: 128m
    # Docker logs can balloon fast under chatty prod traffic.
    # 10 MB × 3 = 30 MB max per container.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: speakup-postgres
    environment:
      POSTGRES_USER: speakup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env da POSTGRES_PASSWORD aniqlanmagan}
      POSTGRES_DB: speakup_db
    volumes:
      - speakup_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakup -d speakup_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # 512 MB is generous for ~1k users - the working set for this
    # schema is small, most queries hit shared_buffers.
    mem_limit: 512m
    # max_connections=100 is the default; keep it, Go pool uses 20.
    # shared_buffers=128MB is a sensible prod default.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: speakup-redis
    # maxmemory caps Redis so rate-limit keys + leaderboard cache
    # + matching queue can never OOM the box. allkeys-lru means
    # when full, the least-recently-used key is evicted - safe
    # for a cache-heavy workload where all keys have TTLs anyway.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - speakup_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 320m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Pronunciation sidecar: ZIPA phoneme recogniser + Kokoro TTS, CPU only.
  #
  # Deliberately NOT published to the host: only speakup-api talks to it, over
  # the compose network, so there is no route to it from the internet.
  talaffuz:
    build: ./sidecar/talaffuz
    container_name: speakup-talaffuz
    environment:
      HOST: 0.0.0.0
      PORT: 7880
      # Measured, not guessed: on a 4-core box 4 threads did 20 s of audio in
      # 1.85 s while 8 threads took 3.13 s. Oversubscribing the cores costs
      # about half the speed.
      ZIPA_THREADS: 4
    volumes:
      # The ~1.5 GB of model files live here so they survive the
      # `up -d --build` that every deploy runs.
      - speakup_talaffuz_models:/models
    # Two of the four cores. coturn relays live voice rooms on this same box
    # and is latency-sensitive, so the recogniser must never be able to take
    # every core: a pronunciation check is worth less than a dropped call.
    cpus: 2
    # Measured peak resident set was 2.06 GB on a 30 s clip (1.5 GB of that is
    # the loaded model). 2.5 GB leaves headroom without risking the host.
    mem_limit: 2560m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TURN/STUN relay for WebRTC voice calls. Runs on host networking so the
  # 49152-65535 UDP relay range and 3478 are reachable directly. Migrated
  # from the old server's manual `docker run`; external-ip in
  # turnserver.conf is pinned to THIS server's public IP.
  coturn:
    image: coturn/coturn:latest
    container_name: speakup-coturn
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - speakup_coturn_data:/var/lib/coturn
    command:
      - -c
      - /etc/coturn/turnserver.conf
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  speakup_uploads:
  speakup_talaffuz_models:
  speakup_pg_data:
  speakup_redis_data:
  speakup_coturn_data:
